# Railway Configuration for Web Service
# This file can be used when creating the Web service in Railway dashboard
# Set Root Directory to "./" and Railway will use this config

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.web"

[deploy]
startCommand = "PORT=${PORT:-3000} node server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
